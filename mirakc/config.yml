filters:
  decode-filter:
    # 標準入力から入力されるTSストリームをリモートホストtsdのTCP 40773ポートに転
    # 送し，tsdから返されたTSストリームを標準出力に出力
    #
    # "Broken pipe"エラーを回避するため`cool-write`オプションを指定
    command: >-
      socat -,cool-write tcp-connect:b25:40773